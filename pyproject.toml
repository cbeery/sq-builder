[project]
name = "stan-quarterly"
version = "0.2.0"
description = "Stan Quarterly — Markdown in, Mixam-ready print PDF out"
requires-python = ">=3.12"
dependencies = [
    "weasyprint>=62",
    "pyyaml>=6",
    "pillow>=10",
    "pypdf>=4",
    "trafilatura>=1.8",
    "segno>=1.6",
]

[project.scripts]
sq = "sq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
